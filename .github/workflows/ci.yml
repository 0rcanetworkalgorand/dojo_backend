name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create stub for file dependency
        run: |
          mkdir -p ../dojo-contracts/artifacts
          echo '{"name":"@0rca/dojo-contracts-artifacts","version":"0.0.1"}' > ../dojo-contracts/artifacts/package.json

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit tests
        run: npx vitest run

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create stub for file dependency
        run: |
          mkdir -p ../dojo-contracts/artifacts
          echo '{"name":"@0rca/dojo-contracts-artifacts","version":"0.0.1"}' > ../dojo-contracts/artifacts/package.json

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Verify project structure
        run: |
          ls src/index.ts
          ls src/routes/taskRoutes.ts
          ls src/routes/agentRoutes.ts
          ls prisma/schema.prisma
          echo "✅ Project structure verified"
