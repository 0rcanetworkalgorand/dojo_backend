name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Patch package.json to remove file dependency
        run: |
          sed -i '/"@0rca\/dojo-contracts-artifacts"/d' package.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit tests
        run: npx vitest run

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Patch package.json to remove file dependency
        run: |
          sed -i '/"@0rca\/dojo-contracts-artifacts"/d' package.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Verify project structure
        run: |
          test -f src/index.ts && echo "✅ src/index.ts"
          test -f src/routes/taskRoutes.ts && echo "✅ taskRoutes"
          test -f src/routes/agentRoutes.ts && echo "✅ agentRoutes"
          test -f prisma/schema.prisma && echo "✅ schema.prisma"
