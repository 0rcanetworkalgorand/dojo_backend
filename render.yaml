services:
  - type: web
    name: orca-dojo-backend
    runtime: node
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: AGENT_MODE
        value: http
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AGENT_SERVER_URL
        sync: false
      - key: ALGOD_SERVER
        value: https://testnet-api.algonode.cloud
      - key: INDEXER_SERVER
        value: https://testnet-idx.algonode.cloud
      - key: ADMIN_ADDRESS
        sync: false
      - key: ADMIN_MNEMONIC
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: VAULT_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DOJO_REGISTRY_APP_ID
        value: "758815322"
      - key: ESCROW_VAULT_APP_ID
        value: "761941677"
      - key: COMMITMENT_LOCK_APP_ID
        value: "761941684"
      - key: PAYOUT_SPLITTER_APP_ID
        value: "758815334"
      - key: USDC_ASSET_ID
        value: "10458941"
      - key: TREASURY_ADDRESS
        sync: false
    healthCheckPath: /health
